<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S4A Countdown Tracker</title>
  <style>
    :root {
      --bg: #f6f5f2;
      --ink: #1c1b17;
      --muted: #5e5a52;
      --line: #ddd9d0;
      --accent: #1f4d38;
      --soft: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.45 system-ui, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .wrap { width: min(980px, calc(100% - 32px)); margin: 0 auto; }
    header { padding: 28px 0 8px; }
    .kicker {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: 32px; font-weight: 650; letter-spacing: -0.03em; }
    .lede { margin: 8px 0 0; max-width: 68ch; color: var(--muted); }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 12px 0;
      background: var(--bg);
    }
    .search {
      flex: 1;
      min-width: 0;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .section { margin: 8px 0 28px; }
    .section h2 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .section h2 span { color: var(--muted); font-weight: 600; letter-spacing: 0; text-transform: none; }
    table { width: 100%; border-collapse: collapse; background: var(--soft); }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: baseline; }
    th { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); font-weight: 700; white-space: nowrap; }
    td:nth-child(3), td.num, th.num { white-space: nowrap; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .title {
      background: transparent;
      border: 0;
      padding: 0;
      color: var(--accent);
      font: inherit;
      text-align: left;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .title[aria-expanded="true"] { font-weight: 700; }
    .detail td { background: #fbfaf7; }
    .detail p { margin: 0; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .week-note {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
    }
    .week-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .week {
      background: var(--bg);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .week span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .week strong {
      display: block;
      font-variant-numeric: tabular-nums;
    }
    .week .added { color: var(--accent); }
    .week .running { font-weight: 650; }
    .week .running em {
      margin-right: 6px;
      color: var(--muted);
      font-size: 11px;
      font-style: normal;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .empty, .error, .loading, .banner {
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      margin: 0 0 12px;
    }
    .error, .banner { border-color: #e4b4a8; }
    .error p, .banner p, .empty p, .loading p { margin: 6px 0 0; }
    .retry {
      margin-top: 12px;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
    }
    footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 8px 0 36px;
      color: var(--muted);
      font-size: 13px;
    }
    footer a { color: var(--accent); }
    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
    @media (max-width: 700px) {
      .scroll { overflow-x: auto; }
      table { min-width: 640px; }
      .week-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="kicker">S4A</p>
      <h1>S4A Countdown Tracker</h1>
    </header>
    <div class="toolbar">
      <label class="sr" for="q">Search artist or release</label>
      <input class="search" id="q" type="search" placeholder="Search artist or release" autocomplete="off">
    </div>
    <p class="sr" id="live" aria-live="polite"></p>
    <div id="banner"></div>
    <main id="stage">
      <div class="loading">
        <strong>Loading the tracker</strong>
        <p>Fetching COMBINED TRACKER.</p>
      </div>
    </main>
    <footer>
      <span id="stamp">Waiting for the sheet.</span>
      <a href="https://docs.google.com/spreadsheets/d/1EPC0_zZqxSOaLFU2AYdLIFswK5CtH7h_APms0nGVZfw/edit?usp=sharing">Open the sheet</a>
    </footer>
  </div>
  <noscript>
    <p>This tracker needs JavaScript to load the Google Sheet.</p>
  </noscript>
  <script>
    const SHEET_ID = "1EPC0_zZqxSOaLFU2AYdLIFswK5CtH7h_APms0nGVZfw";
    const SHEET_NAME = "COMBINED TRACKER";
    const DAY_MS = 24 * 60 * 60 * 1000;

    const state = {
      rows: [],
      loadedAt: null,
      query: "",
      loading: false,
      openId: null
    };

    const stageEl = document.getElementById("stage");
    const bannerEl = document.getElementById("banner");
    const stampEl = document.getElementById("stamp");
    const liveEl = document.getElementById("live");
    const qEl = document.getElementById("q");
    let dayTimer = 0;

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function todayISO() {
      const now = new Date();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      return now.getFullYear() + "-" + m + "-" + d;
    }

    function fmtNum(value) {
      if (value == null || Number.isNaN(value)) return "—";
      return new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 }).format(value);
    }

    function fmtDate(iso) {
      if (!iso) return "—";
      const [y, m, d] = iso.split("-").map(Number);
      return new Date(y, m - 1, d).toLocaleDateString("en-US", {
        month: "short", day: "numeric", year: "numeric"
      });
    }

    function fmtTime(date) {
      return date.toLocaleString("en-US", {
        month: "short", day: "numeric", hour: "numeric", minute: "2-digit"
      });
    }

    function parseDate(cell) {
      if (!cell || cell.v == null || cell.v === "") return null;
      if (typeof cell.f === "string") {
        const iso = cell.f.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (iso) return iso[0];
        const us = cell.f.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
        if (us) {
          return us[3] + "-" + String(us[1]).padStart(2, "0") + "-" + String(us[2]).padStart(2, "0");
        }
      }
      if (typeof cell.v === "string") {
        const iso = cell.v.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (iso) return iso[0];
        const us = cell.v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
        if (us) {
          return us[3] + "-" + String(us[1]).padStart(2, "0") + "-" + String(us[2]).padStart(2, "0");
        }
      }
      const match = String(cell.v).match(/Date\((\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
      if (!match) return null;
      const y = Number(match[1]);
      const m = String(Number(match[2]) + 1).padStart(2, "0");
      const d = String(Number(match[3])).padStart(2, "0");
      return y + "-" + m + "-" + d;
    }

    function parseNumber(cell) {
      if (!cell || cell.v == null || cell.v === "") return null;
      const n = Number(cell.v);
      return Number.isFinite(n) ? n : null;
    }

    function parseText(cell) {
      if (!cell || cell.v == null) return "";
      return String(cell.v).trim();
    }

    function parseFlag(cell) {
      if (!cell || cell.v == null || cell.v === "") return false;
      if (cell.v === true) return true;
      const s = String(cell.v).trim().toLowerCase();
      return s === "true" || s === "yes";
    }

    function loadSheet() {
      const handler = "s4a_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
      return new Promise((resolve, reject) => {
        let settled = false;
        const script = document.createElement("script");
        const timer = setTimeout(() => finish(() => reject(new Error(
          "COMBINED TRACKER did not respond. The sheet has to be shared so anyone with the link can view it."
        ))), 20000);

        function finish(fn) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          script.remove();
          try { delete window[handler]; } catch (e) { window[handler] = undefined; }
          fn();
        }

        window[handler] = (response) => finish(() => {
          if (!response || response.status !== "ok" || !response.table) {
            const reason = response && response.errors && response.errors[0]
              ? (response.errors[0].detailed_message || response.errors[0].message || response.errors[0].reason)
              : "The sheet returned an error.";
            reject(new Error(reason));
            return;
          }
          resolve(response.table);
        });

        script.onerror = () => finish(() => reject(new Error(
          "The tracker sheet could not be loaded. Check that anyone with the link can view it."
        )));
        script.src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID
          + "/gviz/tq?tqx=" + encodeURIComponent("out:json;responseHandler:" + handler)
          + "&sheet=" + encodeURIComponent(SHEET_NAME)
          + "&headers=1";
        document.head.appendChild(script);
      });
    }

    function parseTable(table) {
      const labels = (table.cols || []).map((col) => (col.label || "").trim());
      const index = (name) => labels.findIndex((label) => label === name);
      const artistI = index("Artist Name");
      const releaseI = index("Release Name");
      const releaseDateI = index("Release Date");
      const totalI = index("Total");
      const gridI = index("On Release Grid");
      const weekI = [];
      for (let n = 1; n <= 15; n++) {
        const i = index("Week " + n);
        if (i < 0) throw new Error("The sheet loaded, but Week " + n + " was not in it.");
        weekI.push(i);
      }
      if (artistI < 0 || releaseI < 0 || releaseDateI < 0 || totalI < 0 || gridI < 0) {
        throw new Error("The sheet loaded, but Artist Name, Release Name, Release Date, Total, and On Release Grid were not in it.");
      }
      const today = todayISO();
      return (table.rows || []).map((row) => {
        const cells = row.c || [];
        const artist = parseText(cells[artistI]);
        const release = parseText(cells[releaseI]);
        if (!artist && !release) return null;
        const releaseDate = parseDate(cells[releaseDateI]);
        const total = parseNumber(cells[totalI]);
        return {
          artist,
          release,
          releaseDate,
          total,
          weeks: weekI.map((i) => parseNumber(cells[i])),
          onGrid: parseFlag(cells[gridI]),
          upcoming: Boolean(releaseDate && releaseDate >= today),
          past: Boolean(releaseDate && releaseDate < today)
        };
      }).filter(Boolean).map((row, i) => {
        row.id = String(i);
        return row;
      });
    }

    function matchesQuery(row) {
      if (!state.query) return true;
      return (row.artist + " " + row.release).toLowerCase().includes(state.query);
    }

    function byTotal(a, b) {
      const at = a.total == null ? -1 : a.total;
      const bt = b.total == null ? -1 : b.total;
      if (bt !== at) return bt - at;
      const ad = a.releaseDate || "9999-99-99";
      const bd = b.releaseDate || "9999-99-99";
      if (ad !== bd) return ad < bd ? -1 : 1;
      return a.artist.localeCompare(b.artist) || a.release.localeCompare(b.release);
    }

    function fmtAdded(value) {
      const text = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 }).format(value);
      return value > 0 ? "+" + text : text;
    }

    function weeksHTML(row) {
      let running = 0;
      let filled = 0;
      const cells = row.weeks.map((value, i) => {
        const label = "<span>Week " + (i + 1) + "</span>";
        if (value == null) return '<div class="week">' + label + "</div>";
        filled += 1;
        running += value;
        return '<div class="week">' + label
          + '<strong class="added">' + esc(fmtAdded(value)) + "</strong>"
          + '<strong class="running"><em>Running</em> ' + esc(fmtNum(running)) + "</strong></div>";
      }).join("");
      let note = "";
      if (filled && row.total != null && Math.round(running) !== Math.round(row.total)) {
        note = '<p class="week-note">These weeks add up to ' + esc(fmtNum(running))
          + ". The sheet Total is " + esc(fmtNum(row.total))
          + ", which includes presaves that are not in Week 1 through Week 15.</p>";
      }
      return '<tr class="detail"><td colspan="4"><div id="weeks-' + esc(row.id) + '"><p>Added that week, then the running total</p><div class="week-grid">' + cells + "</div>" + note + "</div></td></tr>";
    }

    function tableHTML(rows) {
      const body = rows.map((row) => {
        const open = state.openId === row.id;
        const title = '<button class="title" type="button" data-open="' + esc(row.id) + '" aria-expanded="' + (open ? "true" : "false") + '" aria-controls="weeks-' + esc(row.id) + '">' + esc(row.release) + "</button>";
        const main = "<tr><td>" + esc(row.artist) + "</td><td>" + title + "</td><td>" + esc(fmtDate(row.releaseDate)) + '</td><td class="num">' + esc(fmtNum(row.total)) + "</td></tr>";
        return open ? main + weeksHTML(row) : main;
      }).join("");
      return '<div class="scroll"><table><thead><tr><th>Artist Name</th><th>Release Name</th><th>Release Date</th><th class="num">Total</th></tr></thead><tbody>' + body + "</tbody></table></div>";
    }

    function sectionHTML(title, rows, emptyText) {
      const count = rows.length + (rows.length === 1 ? " release" : " releases");
      let body;
      if (!rows.length) body = '<p class="empty">' + esc(emptyText) + "</p>";
      else body = tableHTML(rows);
      return '<section class="section"><h2>' + esc(title) + "<span>" + esc(count) + "</span></h2>" + body + "</section>";
    }

    function render() {
      const queried = state.rows.filter(matchesQuery);
      const mainRows = queried.filter((row) => row.onGrid && row.upcoming).sort(byTotal);
      const oldRows = queried.filter((row) => row.past).sort(byTotal);
      const mainEmpty = state.query ? "No upcoming release-grid rows match that search." : "No upcoming releases on the Warner Records release grid.";
      const oldEmpty = state.query ? "No past projects match that search." : "No past projects.";
      stageEl.innerHTML = sectionHTML("Warner Records release grid", mainRows, mainEmpty)
        + sectionHTML("Old", oldRows, oldEmpty);
      stampEl.textContent = state.loadedAt
        ? "Loaded " + fmtTime(state.loadedAt) + " · reloads once a day"
        : "Waiting for the sheet.";
      document.body.dataset.ready = "1";
    }

    function renderError(message) {
      stageEl.innerHTML = '<div class="error"><strong>The tracker did not load</strong><p>'
        + esc(message)
        + '</p><button class="retry" type="button" id="retry">Try again</button></div>';
      const retry = document.getElementById("retry");
      if (retry) retry.addEventListener("click", () => refresh());
      stampEl.textContent = "The sheet did not load.";
    }

    function armDailyReload() {
      clearTimeout(dayTimer);
      dayTimer = setTimeout(() => refresh(), DAY_MS);
    }

    async function refresh() {
      if (state.loading) return;
      state.loading = true;
      try {
        const table = await loadSheet();
        state.rows = parseTable(table);
        state.loadedAt = new Date();
        bannerEl.innerHTML = "";
        render();
        const gridCount = state.rows.filter((row) => row.onGrid && row.upcoming).length;
        liveEl.textContent = "Loaded " + state.rows.length + " rows. " + gridCount + " upcoming releases are on the release grid.";
      } catch (error) {
        const message = error && error.message ? error.message : "The sheet could not be loaded.";
        if (!state.rows.length) renderError(message);
        else bannerEl.innerHTML = '<div class="banner"><p>Refresh failed. Showing the last load. ' + esc(message) + "</p></div>";
        liveEl.textContent = message;
      } finally {
        state.loading = false;
        armDailyReload();
      }
    }

    stageEl.addEventListener("click", (event) => {
      const button = event.target.closest("[data-open]");
      if (!button) return;
      const id = button.getAttribute("data-open");
      state.openId = state.openId === id ? null : id;
      render();
      const again = stageEl.querySelector('[data-open="' + id + '"]');
      if (again) again.focus();
    });
    qEl.addEventListener("input", () => {
      state.query = qEl.value.trim().toLowerCase();
      if (state.rows.length) render();
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && state.loadedAt && Date.now() - state.loadedAt.getTime() >= DAY_MS) {
        refresh();
      }
    });

    refresh();
  </script>
</body>
</html>
